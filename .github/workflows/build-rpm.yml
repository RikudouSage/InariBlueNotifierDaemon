name: Build RPM

on:
  push:
    branches:
      - master
    tags:
      - v*.*.*
  pull_request:

permissions:
  contents: read

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      rpm_file: ${{ steps.rpm.outputs.file }}

    steps:
      - uses: actions/checkout@v4

      - name: Set package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0"
          fi

          sed -i -E "s/^Version:[[:space:]]+.*/Version:        ${version}/" rpm/inari-blue-notifier-daemon.spec
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Pull SDK image
        run: make pull

      - name: Build RPM
        run: make rpm

      - name: Get RPM filename
        id: rpm
        shell: bash
        run: |
          shopt -s nullglob
          rpms=(rpm-out/*.rpm)
          if (( ${#rpms[@]} != 1 )); then
            echo "Expected exactly one RPM, found ${#rpms[@]}." >&2
            exit 1
          fi
          echo "file=$(basename "${rpms[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          path: rpm-out/*.rpm
          archive: false
          if-no-files-found: error

  release:
    needs: build-rpm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-rpm.outputs.rpm_file }}
          path: rpm-out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rpm-out/*.rpm --generate-notes --repo "$GITHUB_REPOSITORY"
